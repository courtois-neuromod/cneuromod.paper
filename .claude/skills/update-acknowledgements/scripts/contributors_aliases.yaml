# Curated identity map for CNeuroMod contributors.json entries.
#
# Keyed on the raw all-contributors identifier: the GitHub `login` when the entry has one,
# otherwise the literal `name` string as it appears in the JSON. Each value is the resolved
# person record used by build_contributors.py. Edit this file by hand as new contributors
# appear in cneuromod.all/*/contributors.json — the script fails loudly (an
# `[UNMAPPED: <key>]` line) rather than guessing at an entry missing from this map.
#
# group: core | consortium
#   "core" is a fixed, user-specified list (Boyle, Pinsard, St-Laurent, Bellec) that
#   deliberately overrides docs/source/AUTHORS.md, which lists Arnaud Boré as a data manager
#   and Marie St-Laurent under the Vision team. Everyone else is "consortium".
#
# Affiliations are taken from docs/source/AUTHORS.md where the person is listed there.
# `affiliation: null` means AUTHORS.md does not list this person at all — a gap to fix
# upstream, not a guess made here.

lunebellec:
  full_name: Lune Bellec
  family_name: Bellec
  given_name: Lune
  affiliation: CRIUGM, Psychology, Université de Montréal, Québec, CA
  group: core

