<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470">
  <title>CNeuroMod MRI recording setup</title>
  <rect width="760" height="470" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" font-size="14" fill="#111111">

  <!-- ===== MRI panel ===== -->

  <text x="190" y="38" font-size="16" text-anchor="middle">Siemens Prisma Fit 3T MRI scanner</text>
  <text x="190" y="57" font-size="13" text-anchor="middle" font-weight="normal">64-channel head/neck coil</text>

  <!-- scanner: bore, table, participant -->
  <g transform="translate(120,145)">
    <rect x="-75" y="-72" width="150" height="144" rx="28" fill="#111111"/>
    <circle r="46" fill="#ffffff"/>
    <rect x="-60" y="10" width="250" height="9" fill="#111111"/>
    <rect x="-28" y="20" width="10" height="52" fill="#111111"/>
    <rect x="160" y="19" width="10" height="53" fill="#111111"/>
    <circle cx="-18" cy="-4" r="12" fill="none" stroke="#111111" stroke-width="3.5"/>
    <path d="M-34,-4 A16,16 0 0 1 -18,-20" fill="none" stroke="#111111" stroke-width="4"/>
    <rect x="-4" y="-15" width="150" height="24" rx="12" fill="none" stroke="#111111" stroke-width="3.5"/>
    <path d="M40,-15 v24 M100,-15 v24" stroke="#111111" stroke-width="2"/>
  </g>

  <!-- headphones + earbuds -->
  <g transform="translate(250,270)" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round">
    <path d="M-26,8 V0 A26,26 0 0 1 26,0 V8"/>
    <rect x="-34" y="4" width="14" height="26" rx="5" fill="#ffffff"/>
    <rect x="20" y="4" width="14" height="26" rx="5" fill="#ffffff"/>
  </g>
  <g transform="translate(318,262)" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round">
    <circle cx="-10" cy="0" r="6"/><circle cx="10" cy="0" r="6"/>
    <path d="M-10,6 V30 Q-10,42 0,42 Q10,42 10,30 V6 M0,42 V52"/>
  </g>
  <text x="22" y="252">Sensimetrics S15</text>
  <text x="22" y="270">earphone inserts</text>
  <text x="22" y="288" font-weight="normal">+ Comply canal tips</text>
  <text x="22" y="306" font-weight="normal">+ foam ear protection</text>

  <!-- eye tracking -->
  <g transform="translate(50,352)" stroke="#111111" stroke-width="3">
    <path d="M-24,0 Q0,-18 24,0 Q0,18 -24,0 Z" fill="#ffffff"/>
    <circle r="8" fill="#ffffff"/><circle r="3.5" fill="#111111" stroke="none"/>
  </g>
  <text x="84" y="348">Eye tracking</text>
  <text x="84" y="366">&amp; pupillometry</text>

  <!-- MRC camera -->
  <g transform="translate(280,355)" stroke="#111111" stroke-width="3" fill="#ffffff">
    <rect x="-22" y="-14" width="36" height="28" rx="4"/>
    <path d="M14,-8 L30,-14 V14 L14,8 Z"/>
    <circle cx="-4" cy="0" r="6"/>
  </g>
  <text x="280" y="392" text-anchor="middle">MRC camera</text>
  <text x="280" y="410" text-anchor="middle" font-weight="normal">+ IR illumination</text>

  <!-- cables into the stack -->
  <g fill="none" stroke="#111111" stroke-width="2">
    <path d="M195,100 H426"/>
    <path d="M310,355 H350 V182 H404"/>
  </g>

  <!-- ===== Stimulus / recording stack ===== -->
  <text x="567" y="38" font-size="16" text-anchor="middle">Open stimulus/recording stack</text>

  <!-- computer -->
  <g transform="translate(426,58)" stroke="#111111" stroke-width="3" fill="#ffffff">
    <rect x="0" y="0" width="58" height="40" rx="3"/>
    <rect x="6" y="6" width="46" height="28" fill="#dddddd" stroke="none"/>
    <path d="M29,40 V50 M16,52 H42"/>
    <rect x="64" y="2" width="20" height="48" rx="2"/>
    <path d="M69,12 H79 M69,20 H79" stroke-width="2"/>
  </g>
  <text x="530" y="70" font-weight="normal">PsychoPy</text>
  <text x="530" y="88" font-weight="normal">OpenAI gym-retro</text>
  <text x="530" y="106" font-weight="normal">Pupil + Aravis</text>

  <!-- game controller -->
  <g transform="translate(448,150)" stroke="#111111" stroke-width="3" fill="#ffffff">
    <rect x="-30" y="-16" width="60" height="32" rx="14"/>
    <path d="M-16,-8 V8 M-24,0 H-8" stroke-width="4"/>
    <circle cx="12" cy="2" r="3.5" fill="#111111" stroke="none"/>
    <circle cx="21" cy="-5" r="3.5" fill="#111111" stroke="none"/>
    <path d="M0,-16 Q0,-28 -12,-32" fill="none" stroke-width="2"/>
  </g>
  <text x="486" y="146">Custom-built</text>
  <text x="486" y="164">game controller</text>

  <!-- headcase -->
  <g transform="translate(690,150)" stroke="#111111" stroke-width="3">
    <circle cx="0" cy="-6" r="16" fill="#ffffff"/>
    <path d="M-10,8 V24 H10 V8" fill="#ffffff"/>
    <path d="M-27,14 V-6 A27,27 0 0 1 27,-6 V14 H19 V-6 A19,19 0 0 0 -19,-6 V14 Z" fill="#111111"/>
  </g>
  <text x="690" y="200" text-anchor="middle">Caseforge</text>
  <text x="690" y="218" text-anchor="middle">custom</text>
  <text x="690" y="236" text-anchor="middle">headcases</text>

  <!-- projector -->
  <g transform="translate(448,222)" stroke="#111111" stroke-width="3" fill="#ffffff">
    <rect x="-28" y="-14" width="56" height="28" rx="4"/>
    <circle cx="12" cy="0" r="8"/>
    <path d="M-20,-6 H-4 M-20,2 H-4" stroke-width="2"/>
    <path d="M-20,14 V20 M20,14 V20"/>
  </g>
  <text x="486" y="218">Epson projector</text>
  <text x="486" y="236" font-weight="normal">+ waveguide</text>
  <g fill="none" stroke="#111111" stroke-width="2">
    <path d="M455,108 V134"/>
    <path d="M420,100 H404 V222 H420"/>
  </g>

  <!-- physiological recordings -->
  <text x="567" y="276" font-size="15" text-anchor="middle">Biopac M160 physiological recordings</text>
  <g font-weight="normal" text-anchor="end">
    <text x="530" y="314">ECG</text>
    <text x="530" y="352">Pulse (PPG)</text>
    <text x="530" y="390">Respiration</text>
    <text x="530" y="428">Skin conductance</text>
  </g>
