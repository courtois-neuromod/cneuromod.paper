name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Served at the root of the custom domain https://paper.cneuromod.ca
  BASE_URL: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued, but don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      # Notebooks run one at a time, with single-threaded BLAS: running them in parallel
      # randomly loses a kernel's completion and the build hangs until the job times out
      # (jupyter-book/mystmd#1276). The timeout turns any future hang into a fast failure.
      - name: Build book (HTML, with notebook execution)
        timeout-minutes: 15
        env:
          OMP_NUM_THREADS: "1"
        run: uv run jupyter book build --html --execute --execute-parallel 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
